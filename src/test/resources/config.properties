# ---------- Application under test ----------
baseUrl=https://automationexercise.com
apiUrl=https://automationexercise.com/api

# ---------- Browser ----------
# chrome | firefox     (override: -Dbrowser=firefox)
browser=chrome
headless=false

# ---------- Timeouts (seconds) ----------
explicit.wait=20
page.load.timeout=60

# ---------- Resilience ----------
# UI tests: one retry for infrastructure noise on the public site (API tests are never retried)
ui.retry.count=1
# API client: attempts on HTTP 5xx / 429 from the shared host
api.retry.attempts=3

# ---------- Practice-site test card (no real payment is made) ----------
test.card.number=4242424242424242
test.card.cvc=123
test.card.month=12
test.card.year=2030
