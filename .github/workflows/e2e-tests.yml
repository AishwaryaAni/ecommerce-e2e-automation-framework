name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 4 * * *"   # nightly, 10:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: "TestNG suite file"
        required: false
        default: "testng.xml"
        type: choice
        options: [ testng.xml, testng-smoke.xml ]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run API + UI + E2E tests (headless Chrome)
        id: tests
        continue-on-error: true
        run: mvn -B clean test -Dheadless=true -Dsuite=${{ github.event.inputs.suite || 'testng.xml' }}

      - name: Describe the environment in the report
        if: always()
        run: |
          mkdir -p target/allure-results
          {
            echo "Application=https://automationexercise.com"
            echo "Browser=Chrome (headless)"
            echo "Layers=API, UI, End-to-End"
            echo "Commit=${GITHUB_SHA::7}"
          } > target/allure-results/environment.properties

      - name: Set up Node (for Allure CLI)
        if: always()
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline generate target/allure-results --clean -o allure-report

      - name: Write run summary
        if: always()
        run: |
          node -e '
            const s = require("./allure-report/widgets/summary.json").statistic;
            const rate = s.total ? ((s.passed / s.total) * 100).toFixed(1) : "0";
            console.log(`### E2E results\n\n| Total | Passed | Failed | Broken | Skipped | Pass rate |\n|---|---|---|---|---|---|\n| ${s.total} | ${s.passed} | ${s.failed} | ${s.broken} | ${s.skipped} | ${rate}% |`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure report (build artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::One or more tests failed — see the Allure report."
          exit 1

  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
